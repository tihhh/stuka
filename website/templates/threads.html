{% extends "base.html" %} {% block title %}Threads {% endblock %}
{%block content %}
<h1 align="center">Threads</h1>
<br/>
<ul class="list-group list-group-flush" id="notes">
    {% for thread in threads %}
    <li class="list-group-item">
        {{ thread.data }}
    </li>
    {% endfor %}
    <button type="button" class="btn btn-primary" onclick="createThread()">
        <span aria-hidden="true">New Thread;</span>
    </button>
</ul>

{% endblock %}
